</head>
<body>
    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav class="glass-nav">
        <div class="nav-content">
            <a href="index.html" class="logo">
                <img src="assets/icons/logo_white.png" alt="Logo" class="nav-logo">

            <ul class="nav-links">

            </div>
        </div>
        <!-- Search Capsule -->
        <div id="search-capsule" class="search-capsule">
            <div class="search-input-wrap">
                <input type="text" id="search-input" placeholder="Cari karya, jurnal, hashtag...">

                    <img src="assets/icons/magnifying-glass-bold.svg" alt="Search">

        <div class="search-results-wrap">
            <div id="search-results" class="search-results-grid"></div>

    <main>
        <section class="hero-section">
            <div class="glass-card hero-card fade-in">
                <h1>Said<span class="gradient-text">@taufiq</span></h1>
                <div class="sub-headline">creator, artist, writer, developer</div>
                <p class="philosophy">Sebuah karya tidak berhenti pada apa yang terlihat, tetapi hidup melalui ide, cerita, dan pengalaman dibaliknya.</p>
                <div class="best-works-wrapper fade-in">
                    <div class="carousel-container-home glass-card">
                        <div class="carousel-nav-home prev-home">
                            <svg viewBox="0 0 256 256"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg>

                        </div>
                        <div class="carousel-dots-home" id="home-carousel-dots"></div>
                    </div>

                <div id="latest-journal-container" class="fade-in" style="margin-top: 4rem; width: 100%; max-width: 800px; margin-left: auto; margin-right: auto;">
                    <!-- Latest post will be injected here -->
